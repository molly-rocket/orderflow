[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/contracts",
    "crates/bus",
    "crates/store",
    "crates/runtime",
    "crates/collector",
    "crates/book-engine",
    "crates/aggregator",
    "crates/writer",
    "crates/gateway",
    "crates/venue-sim",
    "crates/e2e",
    "xtask",
]

[workspace.package]
edition = "2024"
# let-chains (`if let … && …`) need 1.88.
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
orderflow-domain = { path = "crates/domain" }
orderflow-contracts = { path = "crates/contracts" }
orderflow-bus = { path = "crates/bus" }
orderflow-store = { path = "crates/store" }
orderflow-runtime = { path = "crates/runtime" }
orderflow-collector = { path = "crates/collector" }
orderflow-writer = { path = "crates/writer" }
orderflow-gateway = { path = "crates/gateway" }
orderflow-aggregator = { path = "crates/aggregator" }
orderflow-book-engine = { path = "crates/book-engine" }
venue-sim = { path = "crates/venue-sim" }

prost = "0.14"
prost-build = "0.14"
protox = "0.10"
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# rustls with the pure-Rust `ring` provider: builds on Windows and Linux without cmake/nasm/openssl.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive", "env"] }
async-nats = "0.52"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# `Market::market_type` is the glossary term; renaming it to dodge the lint would hurt clarity.
struct_field_names = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
